name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR-Agent Review
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENCODE_ZEN_KEY }}
          OPENAI_API_BASE: https://opencode.ai/zen/v1
          OPENAI_API_MODEL: deepseek-v4-flash-free
          PR_AGENT_CONFIG.AI_TIMEOUT: 180
          PR_AGENT_CONFIG.MAX_DESCRIPTION_TOKENS: 200
          PR_AGENT_CONFIG.MAX_COMMITS_TOKENS: 100
          PR_AGENT_CONFIG.REVIEW.EXTRA_INSTRUCTIONS: "Reply in Chinese; mark severity (BLOCKER/MAJOR/MINOR/NIT). Be concise."
